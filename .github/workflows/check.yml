name: Clean-checkout HINT-SD WebShop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  method:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.3.5 requests==2.32.5
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==5.17.0 peft==0.21.0 accelerate==1.15.0 python-dotenv==1.2.2 datasets==4.8.5
      - run: python -m hint_webshop.setup --framework
      - run: python -m hint_webshop.setup --verify
      - run: python scripts/check_release.py
      - run: python -m pytest tests -q
      - run: bash -n scripts/setup.sh scripts/train.sh scripts/run_both.sh scripts/eval.sh
      - run: bash scripts/train.sh --dry-run
  environment:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      _JAVA_OPTIONS: '-XX:+UseSerialGC -Xss512k -Xmx1g'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r configs/environment-requirements.txt
      - run: python -m hint_webshop.setup --framework
      - run: python src/assets.py --download --nlp --index --verify
      - run: python -m hint_webshop.env_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-webshop-cpu-smoke
          path: results/environment_smoke.json
          if-no-files-found: ignore
